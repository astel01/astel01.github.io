<head>

</head>
<body>

  <div class="site-nav">
    <a class="brand" href="../index.html">아스텔</a>
    <span class="ep-tag">EP. 02</span>
  </div>

  <div class="strip">

    <div class="cut size-m">
      <div class="cut-media fade-bottom"><img src="images/ep2/earth_top.png" alt="지구, 첫 번째 컷"></div>

    <div class="cut size-l reveal">

    <div class="cut size-l reveal">
      <div class="cut-media">
        <img src="images/ep2/girl_power.png" alt="소녀가 손 위의 빛을 보여주는 장면">
        <div class="bubble-wrap" style="top:15%; right:20%;"><div class="bubble">아빠! 여기봐!!</div></div>
      </div>
    </div>

    <div class="cut">
      <div class="cut-text text-impact">그 힘은 모두에게<br>동시에 내려앉았다</div>

    <div class="cut size-m">

        <img src="images/ep2/man_power.png" alt="남성이 놀라며 손 위의 빛을 보는 장면">

  <div class="ep-end">
    <a href="ep1.html">← 이전 화</a>
    <a class="next" href="ep3.html">다음 화 →</a>
  </div>

<script>
  const revealEls = document.querySelectorAll('.reveal');
  const io = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add('is-visible');
        io.unobserve(entry.target);
      }
    });
  }, { threshold: 0.2 });
  revealEls.forEach(el => io.observe(el));
</script>

</body>
</html>
