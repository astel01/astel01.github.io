<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3화 — 아스텔</title>
<link rel="stylesheet" href="../assets/site.css">
</head>
<body>

  <div class="site-nav">
    <a class="brand" href="../index.html">아스텔</a>
    <span class="ep-tag">EP. 03</span>
  </div>

  <div class="strip">

    <div class="cut">
      <div class="cut-text text-normal">권력과 자원은 오래 사는<br>소수의 손에 몇 세기째 고여 있었다</div>
    </div>

    <div class="cut size-m">
      <div class="cut-media">
        <img src="images/ep3/grandma_plea.png" alt="할머니를 부탁하는 장면">
        <div class="bubble-wrap" style="top:5%; left:6%;"><div class="bubble">우리 할머니 좀... 제발</div></div>
      </div>
    </div>

    <div class="cut">
      <div class="cut-text text-normal">대다수에겐<br>애초에 허락되지도 않았다</div>
    </div>

    <div class="cut size-l reveal">
      <div class="cut-media"><img src="images/ep3/dying_grandma.png" alt="죽어가는 할머니를 지키는 장면"></div>
    </div>

    <div class="cut">
      <div class="cut-text text-impact-quote">"...왜, 우리만."</div>
    </div>

    <div class="cut size-l reveal">
      <div class="cut-media"><img src="images/ep3/man_ruins_power.png" alt="폐허 속에서 힘을 각성하는 남자"></div>
    </div>

    <div class="cut">
      <div class="cut-text text-normal">물음은 분노가 되었고</div>
    </div>

    <div class="cut size-m">
      <div class="cut-media"><img src="images/ep3/power_surge.png" alt="힘이 폭주하는 장면"></div>
    </div>

    <div class="cut">
      <div class="cut-text text-impact">분노는 전쟁이 되었다</div>
    </div>

    <div class="cut size-l reveal">
      <div class="cut-media"><img src="images/ep3/war_explosion.png" alt="전쟁이 격화되는 장면"></div>
    </div>

    <div class="cut">
      <div class="cut-text text-normal">축복인 줄 알았던 초능력은</div>
    </div>

    <div class="cut size-full reveal">
      <div class="cut-media"><img src="images/ep3/ruined_city.png" alt="멸망한 세상"></div>
    </div>

    <div class="cut">
      <div class="cut-text text-impact" style="font-size:25px">세상을 멸망시키게 되었다</div>
    </div>
  </div>

  <div class="ep-end">
    <a href="ep2.html">← 이전 화</a>
    <a class="next" href="ep4.html">다음 화 →</a>
  </div>

<script>
  const revealEls = document.querySelectorAll('.reveal');
  const io = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add('is-visible');
        io.unobserve(entry.target);
      }
    });
  }, { threshold: 0.2 });
  revealEls.forEach(el => io.observe(el));
</script>

</body>
</html>
